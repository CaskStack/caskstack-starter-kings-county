title: "Kings County Distillery — New York City's Premier Craft Whiskey"
meta_description: "Kings County Distillery is NYC's oldest, largest, and premier whiskey distillery, handcrafting award-winning bourbon, peated bourbon, and Empire Rye in the Brooklyn Navy Yard."
brand_name: "Kings County Distillery"
tagline: "New York City's Oldest Craft Whiskey Distillery • Est. 2010"
location: "Brooklyn Navy Yard • Paymaster Building 121 • Brooklyn, NY"
est_year: "2010"
distiller: "Colin Spoelman & David Haskell, Founders"

batch_stats:
  location_badge: "Paymaster Building 121 (Built 1899)"
  grain_source: "100% NY State Organic Corn & Malted Barley"
  stills: "Traditional Scottish Copper Pot Stills"
  accolades: "Craft Distillery of the Year • ADI"

sections:
  - type: navy_yard_hero
    badge: "NYC First Distillery Since Prohibition"
    headline: "Handcrafted Whiskey in the Brooklyn Navy Yard"
    subheadline: "Founded in 2010 in the historic 123-year-old Paymaster Building, Kings County Distillery makes award-winning handmade bourbon, peated bourbon, and Empire Rye using 100% New York State organic grains and traditional Scottish pot stills."
    cta_primary: "Shop Bottled Whiskeys"
    cta_primary_url: "#whiskey-lineup"
    cta_secondary: "Gatehouse Tours & Flights"
    cta_secondary_url: "#gatehouse-tours"
    hero_image: "https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=1600&q=80"
    badge_callout: "Brooklyn Navy Yard • Est. 2010"

  - type: prohibition_heritage
    eyebrow: "The History & The Yard"
    headline: "Reclaiming New York City's Historic Whiskey Legacy"
    story_p1: "Before Prohibition, Brooklyn was home to dozens of distilleries along the East River. In 2010, Kings County Distillery became the very first whiskey distillery granted a license in New York City since 1920."
    story_p2: "Operating inside the 1899 Paymaster Building at the Brooklyn Navy Yard, we mill, mash, ferment, and pot distill every single batch on-site using traditional copper stills fabricated in Scotland and charred American oak casks."
    pillars:
      - title: "100% New York Grain"
        desc: "Organic New York State corn from the Finger Lakes and malted barley from local family-owned maltsters."
        icon: "fa-solid fa-wheat-awn"
      - title: "Scottish Pot Stills"
        desc: "Open-flame double distillation in traditional swan-neck copper pot stills yielding uncompromised body."
        icon: "fa-solid fa-fire"
      - title: "Iconic Typewriter Labels"
        desc: "Minimalist, honest vintage bottle labels printed with typewriter typography detailing exact batch numbers."
        icon: "fa-solid fa-font"
      - title: "Paymaster Warehouse"
        desc: "Aged gracefully in the historic 123-year-old brick Paymaster building under Brooklyn maritime climate."
        icon: "fa-solid fa-building-columns"

  - type: whiskey_lineup_grid
    headline: "Our Handcrafted Whiskey Portfolio"
    subheadline: "Direct from the Brooklyn Navy Yard barrel rooms to your glass. Filter by spirit style below."
    categories:
      - name: "Straight Bourbon"
        slug: "bourbon"
      - name: "Peated Bourbon"
        slug: "peated"
      - name: "Empire Rye"
        slug: "rye"
      - name: "Specialty & White"
        slug: "specialty"
    products:
      - name: "Straight Bourbon Whiskey"
        category: "Straight Bourbon"
        category_slug: "bourbon"
        proof: "90 Proof • 45% ABV"
        price: "$69.00"
        badge: "Double Gold • SFWSC"
        description: "Our signature flagship bourbon. Made from New York State organic corn and English malted barley, aged in charred oak barrels for rich notes of caramel, vanilla, molasses, and warm baking spice."
        tasting_notes: ["Rich Vanilla", "Molasses", "Burnt Sugar", "Toasted Oak"]
        image: "https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=600&q=80"
        mashbill: "80% Organic NY Corn, 20% English Malted Barley"
      - name: "Peated Bourbon Whiskey"
        category: "Peated Bourbon"
        category_slug: "peated"
        proof: "90 Proof • 45% ABV"
        price: "$75.00"
        badge: "World's First Peated Bourbon"
        description: "An inventive hybrid of American bourbon and Scotch peated malt. Made with malted barley exposed to peat smoke in Scotland and organic NY corn, creating a smoky, savory, and sweet masterpiece."
        tasting_notes: ["Campfire Smoke", "Salted Caramel", "Barbecue Ember", "Leather"]
        image: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80"
        mashbill: "Corn mashbill paired with Scottish Peated Malt"
      - name: "Empire Rye Whiskey"
        category: "Empire Rye"
        category_slug: "rye"
        proof: "102 Proof • 51% ABV"
        price: "$85.00"
        badge: "Certified Empire Rye"
        description: "Crafted strictly according to the historic Empire Rye standard with 80% New York-grown organic rye and 20% malted barley. Bold black pepper, dried cherry, mint, and nutmeg."
        tasting_notes: ["Black Pepper", "Dried Cherry", "Spiced Clove", "Sweet Mint"]
        image: "https://images.unsplash.com/photo-1569529465841-dfecdab7503b?auto=format&fit=crop&w=600&q=80"
        mashbill: "80% NY Organic Rye, 20% NY Malted Barley"
      - name: "Chocolate Whiskey"
        category: "Specialty & White"
        category_slug: "specialty"
        proof: "80 Proof • 40% ABV"
        price: "$45.00"
        badge: "Brooklyn Collaboration"
        description: "Our moonshine infused with ground roasted cacao bean husks sourced from Brooklyn craft chocolate makers. Unsweetened, deeply aromatic dark chocolate with pure corn whiskey foundation."
        tasting_notes: ["Dark Cacao", "Roasted Coffee", "Raw Cocoa Nib", "Sweet Corn"]
        image: "https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=600&q=80"
        mashbill: "100% NY Corn infused with Brooklyn Raaka Cacao"
      - name: "Barrel Strength Straight Bourbon"
        category: "Straight Bourbon"
        category_slug: "bourbon"
        proof: "128.4 Proof • 64.2% ABV"
        price: "$98.00"
        badge: "Distillery Exclusive"
        description: "Pulled directly from select single barrels in the Paymaster warehouse without dilution. Intense, concentrated toffee, pipe tobacco, dark cocoa, and lingering warmth."
        tasting_notes: ["Pipe Tobacco", "Dark Toffee", "Cacao Cask", "Charred Pecan"]
        image: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80"
        mashbill: "Uncut, Unfiltered Single Barrel Straight Bourbon"
      - name: "Moonshine (White Corn Whiskey)"
        category: "Specialty & White"
        category_slug: "specialty"
        proof: "80 Proof • 40% ABV"
        price: "$38.00"
        badge: "Historic Recipe"
        description: "100% New York State organic corn double pot distilled without oak aging. Clean, floral, and sweet with rich masa harina and corn pudding aromas."
        tasting_notes: ["Sweet Corn", "Masa Harina", "White Blossom", "Honeydew"]
        image: "https://images.unsplash.com/photo-1569529465841-dfecdab7503b?auto=format&fit=crop&w=600&q=80"
        mashbill: "100% NY State Organic Corn"

