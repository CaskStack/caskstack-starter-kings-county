  - type: gatehouse_tours
    headline: "The Gatehouse at the Brooklyn Navy Yard"
    subheadline: "Located in the historic 1896 Sands Street entrance gate. Join us for guided distillery tours, tasting flights, craft cocktails, and courtyard seating."
    address: "299 Sands Street, Building 121, Brooklyn, NY 11205"
    phone: "(347) 529-6040"
    hours: "Daily: 12:00 PM – 10:00 PM (Tours Wed - Sun)"
    tour_options:
      - title: "Historic Distillery & Pot Still Tour"
        price: "$24 / Person"
        duration: "45 Minutes"
        desc: "Walk through the historic 1899 Paymaster Building, view our Scottish pot stills, and sample 4 flagship whiskeys."
      - title: "Master Distiller Barrel Tasting & Flight"
        price: "$50 / Person"
        duration: "75 Minutes"
        desc: "Thief cask-strength whiskey straight from the barrel, explore rare peated bourbon expressions, and receive a commemorative rocks glass."
